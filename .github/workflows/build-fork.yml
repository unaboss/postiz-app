name: Build fork image

on:
  workflow_dispatch:
  push:
    branches:
      - feat/configurable-ai-provider

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dev
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/unaboss/postiz-app:latest
            ghcr.io/unaboss/postiz-app:deepseek
          build-args: |
            NEXT_PUBLIC_VERSION=deepseek
          cache-from: type=gha
          cache-to: type=gha,mode=max
